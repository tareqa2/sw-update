<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SW Version Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #0f1628;
      --border: #1e3a5f;
      --accent: #00d4ff;
      --accent2: #00ff9d;
      --warn: #ffb300;
      --danger: #ff4757;
      --text: #c8d8e8;
      --text-dim: #5a7a9a;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(0,100,200,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(0,212,255,0.05) 0%, transparent 60%);
    }

    /* HEADER */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      background: rgba(10,14,26,0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    nav { display: flex; gap: 0.5rem; }

    nav a {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      padding: 0.4rem 1rem;
      border: 1px solid transparent;
      border-radius: 3px;
      transition: all 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(0,212,255,0.06);
    }

    /* MAIN */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* PANELS */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 0.6rem 1rem;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(30,58,95,0.4);
      color: var(--text);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(0,212,255,0.03); }

    /* BADGES */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-family: var(--font-ui);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge-initial  { background: rgba(90,122,154,0.2); color: var(--text-dim); border: 1px solid var(--border); }
    .badge-updated  { background: rgba(0,255,157,0.1);  color: var(--accent2); border: 1px solid rgba(0,255,157,0.3); }
    .badge-upgrade  { background: rgba(0,255,157,0.1);  color: var(--accent2); border: 1px solid rgba(0,255,157,0.3); }
    .badge-downgrade{ background: rgba(255,71,87,0.1);  color: var(--danger);  border: 1px solid rgba(255,71,87,0.3); }
    .badge-current  { background: rgba(0,212,255,0.1);  color: var(--accent);  border: 1px solid rgba(0,212,255,0.3); }
    .badge-nochange { background: rgba(90,122,154,0.15); color: var(--text-dim); border: 1px solid var(--border); }

    /* FORMS */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      font-family: var(--font-ui);
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--accent); }
    .form-group .hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem; font-family: var(--font-mono); }

    /* BUTTONS */
    .btn {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.6rem 1.5rem;
      border: 1px solid;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }

    .btn-primary { background: rgba(0,212,255,0.1); color: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: rgba(0,212,255,0.2); box-shadow: 0 0 12px rgba(0,212,255,0.2); }
    .btn-success { background: rgba(0,255,157,0.1); color: var(--accent2); border-color: var(--accent2); }
    .btn-success:hover { background: rgba(0,255,157,0.2); }
    .btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }

    .btn-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }

    /* FLASH */
    .flash {
      padding: 0.75rem 1.2rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    .flash-success { background: rgba(0,255,157,0.1); border: 1px solid rgba(0,255,157,0.3); color: var(--accent2); }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
    }

    .stat-card.warn::before { background: var(--warn); }
    .stat-card.danger::before { background: var(--danger); }
    .stat-card.ok::before { background: var(--accent2); }

    .stat-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      color: var(--accent);
    }

    .stat-sub {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SW-VERSION-MGR</div>
  <nav>
    <a href="{{ url_for('index') }}"   class="{{ 'active' if request.endpoint == 'index' else '' }}">Dashboard</a>
    <a href="{{ url_for('update') }}"  class="{{ 'active' if request.endpoint == 'update' else '' }}">Update</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' else '' }}">History</a>
  </nav>
</header>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">✓ {{ message }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

</body>
</html>
