# Full regression every night at 00:00 Israel time, against whatever is on main.
# Runs on GitHub's cloud runner: it tests the code, not the cluster, so the laptop can be off.
name: nightly-regression

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:          # "Run workflow" button for on-demand runs

permissions:
  contents: read

jobs:
  regression:
    name: Full regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m flake8 .

      - name: Sanity + regression with coverage
        run: >
          python -m pytest -m "sanity or regression" -v
          --cov=app --cov-report=term-missing --cov-report=xml
          --junitxml=regression-report.xml

      - name: Write summary
        if: always()
        run: |
          echo "### Nightly regression - $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("regression-report.xml").getroot()
          s = s if s.tag == "testsuite" else s[0]
          print(f"\n| tests | failures | errors | skipped | time |\n|---|---|---|---|---|")
          print(f"| {s.get('tests')} | {s.get('failures')} | {s.get('errors')} | {s.get('skipped')} | {float(s.get('time')):.1f}s |")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            regression-report.xml
            coverage.xml

  # Only for manual runs ("Run workflow" button): run the suites on the in-cluster runner too,
  # and push the results to the Pushgateway so they appear live on the Grafana dashboard.
  # Scheduled runs skip this job - at 00:00 the laptop (and Minikube) may be off.
  regression-to-dashboard:
    name: Regression on cluster runner -> Grafana
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, minikube]
    timeout-minutes: 15
    env:
      PUSHGATEWAY_URL: http://pushgateway.monitoring.svc.cluster.local:9091
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -q --root-user-action=ignore -r requirements-dev.txt

      - name: Sanity tests
        run: python -m pytest -m sanity -q --junitxml=sanity-report.xml

      - name: Regression tests
        run: python -m pytest -m regression -q --junitxml=regression-report.xml

      - name: Push results to Grafana (Pushgateway)
        if: always()
        run: |
          for suite in sanity regression; do
            if [ -f "$suite-report.xml" ]; then
              python scripts/push_test_results.py --url "$PUSHGATEWAY_URL" \
                --suite "$suite" --junit "$suite-report.xml" --commit "${GITHUB_SHA::7}"
            fi
          done
