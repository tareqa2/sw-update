# CI/CD for the app - 5 stages:
#
#   1. Lint  ->  2. Test  ->  3. Build & push  ->  4. Deploy  ->  5. Verify
#                   |-- sanity       (Flask test client)
#                   |-- regression   (Flask test client)
#                   '-- e2e          (the real Docker image, started inside the job)
#
#   pull request : stages 1-3 (image is built, not pushed)    "is this safe to merge?"
#   push to main : all 5 stages                                "ship it, then prove it works"
name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # least privilege: the workflow only needs to read the repo

env:
  IMAGE: tareqelya12/sw-update
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ 1. LINT
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: flake8
        run: python -m flake8 .

  # ------------------------------------------------------------------ 2. TEST
  # One stage, three suites running in parallel. fail-fast: false = every suite
  # finishes and reports, even if another one fails.
  test:
    name: 2. Test (${{ matrix.suite }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [sanity, regression, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Sanity / regression tests
        if: matrix.suite != 'e2e'
        run: python -m pytest -m ${{ matrix.suite }} -v --junitxml=${{ matrix.suite }}-report.xml

      # E2E before anything ships: build the real image and test it over HTTP,
      # exactly as nginx will call it in Kubernetes.
      - name: Build and start the app container
        if: matrix.suite == 'e2e'
        run: |
          docker build -t sw-update:ci --build-arg APP_VERSION=ci .
          docker run -d --name app -p 8080:8000 -e SECRET_KEY="$(openssl rand -hex 32)" sw-update:ci
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8080/readyz && exit 0
            sleep 2
          done
          docker logs app; exit 1

      - name: E2E tests against the container
        if: matrix.suite == 'e2e'
        env:
          BASE_URL: http://127.0.0.1:8080
        run: python -m pytest tests/e2e -m e2e --noconftest -v --junitxml=e2e-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.suite }}
          path: ${{ matrix.suite }}-report.xml

  # ------------------------------------------------------------------ 3. BUILD & PUSH
  build:
    name: 3. Build and push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag = short commit SHA
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # On a PR: build only (proves the Dockerfile still works). On main: build and push.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ 4. DEPLOY
  # Runs on the self-hosted runner pod INSIDE Minikube (the only place that can reach the cluster).
  # kubectl authenticates with the pod's ServiceAccount, which RBAC limits to the sw-update namespace.
  deploy:
    name: 4. Deploy to Minikube
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, minikube]
    environment: minikube
    env:
      TAG: ${{ needs.build.outputs.tag }}
      KUBECTL_VERSION: v1.37.0
    steps:
      - name: Check out Kubernetes manifests
        uses: actions/checkout@v4
        with:
          repository: tareqa2/sw-update-devops
          path: devops

      - name: Install kubectl ${{ env.KUBECTL_VERSION }}
        run: |
          curl -sSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check cluster access (RBAC)
        run: |
          kubectl auth can-i patch deployments -n sw-update
          kubectl -n sw-update get deploy

      - name: Ensure the app Secret exists
        run: |
          kubectl -n sw-update create secret generic sw-backend-secret \
            --from-literal=SECRET_KEY="${{ secrets.APP_SECRET_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy image ${{ env.TAG }}
        run: |
          sed -i "s/newTag: .*/newTag: ${TAG}/" devops/k8s/kustomization.yaml
          kubectl apply -k devops/k8s
          kubectl -n sw-update rollout status deploy/sw-backend --timeout=180s
          kubectl -n sw-update rollout status deploy/sw-nginx --timeout=120s

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n sw-update get pods -o wide
          kubectl -n sw-update describe deploy sw-backend
          kubectl -n sw-update logs deploy/sw-backend --tail=50

  # ------------------------------------------------------------------ 5. VERIFY
  # Prove the live cluster works through nginx, then send every suite's result to Grafana.
  verify:
    name: 5. Verify live cluster
    needs: [build, deploy]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, minikube]
    env:
      TAG: ${{ needs.build.outputs.tag }}
      # nginx Service, reached through cluster DNS - no tunnel, no port-forward
      BASE_URL: http://sw-nginx.sw-update.svc.cluster.local
      PUSHGATEWAY_URL: http://pushgateway.monitoring.svc.cluster.local:9091
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: python -m pip install -q --root-user-action=ignore -r requirements-dev.txt

      - name: Verify the new version is the one serving
        run: |
          version=$(curl -sf "$BASE_URL/healthz" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "Cluster serves version: $version (expected $TAG)"
          test "$version" = "$TAG"

      - name: E2E tests on the live cluster (through nginx)
        run: python -m pytest tests/e2e -m e2e --noconftest -v --junitxml=e2e-report.xml

      # Sanity + regression reports come from stage 2; e2e is the live-cluster run above.
      - name: Download stage-2 test reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: stage2
          merge-multiple: true

      # Push results even when a suite failed - a red result is exactly what the dashboard should show.
      - name: Push test results to Grafana (Pushgateway)
        if: always()
        continue-on-error: true
        run: |
          for suite in sanity regression; do
            if [ -f "stage2/$suite-report.xml" ]; then
              python scripts/push_test_results.py --url "$PUSHGATEWAY_URL" \
                --suite "$suite" --junit "stage2/$suite-report.xml" --commit "$TAG"
            fi
          done
          if [ -f e2e-report.xml ]; then
            python scripts/push_test_results.py --url "$PUSHGATEWAY_URL" \
              --suite e2e --junit e2e-report.xml --commit "$TAG"
          fi

      - name: Upload live E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-e2e-live
          path: e2e-report.xml
